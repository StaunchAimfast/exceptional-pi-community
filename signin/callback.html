
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17112f">
  <title>EXCEPTIONAL | Pi Sign-In</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #100d20;
      color: #f8f6ff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .card {
      background: #1c1732;
      padding: 32px;
      border-radius: 16px;
      max-width: 380px;
      width: 85%;
    }
    h2 { color: #f5bd55; }
    p { line-height: 1.6; }
    a { color: #f5bd55; }
  </style>
</head>
<body>
  <div class="card">
    <h2>EXCEPTIONAL</h2>
    <p id="status">Verifying your Pi sign-in...</p>
    <p id="profile"></p>
    <p><a href="/">Return to EXCEPTIONAL</a></p>
  </div>

  <script>
    async function completePiSignIn() {
      const status = document.getElementById("status");
      const profile = document.getElementById("profile");

      const params = new URLSearchParams(
        window.location.hash.slice(1)
      );

      const token = params.get("access_token");
      const returnedState = params.get("state");
      const expectedState = sessionStorage.getItem("pi_oauth_state");

      sessionStorage.removeItem("pi_oauth_state");

      history.replaceState(
        null,
        "",
        window.location.pathname
      );

      if (!expectedState || returnedState !== expectedState) {
        status.textContent = "Sign-in verification failed. Please try again.";
        return;
      }

      if (params.get("error")) {
        status.textContent = "Pi sign-in was cancelled or unsuccessful.";
        return;
      }

      if (!token) {
        status.textContent = "No access token received. Please try again.";
        return;
      }

      try {
        const response = await fetch("https://api.minepi.com/v2/me", {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        if (!response.ok) {
          throw new Error("Pi identity verification failed.");
        }

        const user = await response.json();

        if (!user.uid || !user.username) {
          throw new Error("Pi returned incomplete identity information.");
        }

        status.textContent = "Pi identity verified successfully.";
        profile.textContent = "Welcome, " + user.username + "!";

      } catch (error) {
        status.textContent = error.message;
      }
    }

    completePiSignIn();
  </script>
</body>
    </html>
